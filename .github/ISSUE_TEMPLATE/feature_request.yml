name: Feature request
description: Suggest a function, operator, or calculator behavior.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The calculation or workflow you cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
      description: Include a script example and the stack result you want.
      placeholder: |
        nthroot is not enough when I want log base b.
        log(8, 2) should show 3
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language or functions
        - Symbolic calculus
        - Linear algebra
        - Plotting
        - Stack or keypad
        - Function reference
        - Something else
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
